[workspace]
members = [
    "interaction-net",
    "evolution",
    "rewriter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["zero"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.6"
rayon = "1.8"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1