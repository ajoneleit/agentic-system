# Pre-commit hooks configuration for quality gates enforcement
repos:
  # Documentation Quality Gates - FIRST (fail fast)
  - repo: local
    hooks:
      - id: documentation-reality-check
        name: Documentation Reality Check
        entry: python docs/validation/quality_gates.py --pre-commit
        language: system
        files: '^(docs/.*\.md|src/.*\.py)$'
        pass_filenames: false
        always_run: false

  # Code Formatting
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  # Import Sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.6.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  # Documentation Validation (after code changes)
  - repo: local
    hooks:
      - id: validate-documentation-links
        name: Validate Documentation Links
        entry: python docs/validation/doc_validator.py --check-code-refs --fail-fast
        language: system
        files: '^(docs/.*\.md|src/.*\.py)$'
        pass_filenames: false

  # Reality Check (final validation)
  - repo: local
    hooks:
      - id: final-reality-check
        name: Final Reality Check
        entry: python docs/validation/reality_checker.py --check-architecture --check-features
        language: system
        files: '^(src/.*\.py|docs/.*\.md)$'
        pass_filenames: false
        stages: [pre-push]

# Default stages
default_stages: [commit]

# Fail fast - stop on first failure
fail_fast: true