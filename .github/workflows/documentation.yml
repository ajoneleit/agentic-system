name: Documentation Validation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '**/*.md'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '**/*.md'
  workflow_dispatch:

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PYTHONUNBUFFERED: 1

jobs:
  validate-documentation-structure:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Validate Documentation Structure
        run: |
          python docs/validation/doc_validator.py --check-structure
          echo "✅ Documentation structure validation passed"

  validate-reality-alignment:
    name: Validate Reality Alignment
    runs-on: ubuntu-latest
    needs: validate-documentation-structure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Validate Code References
        run: |
          python docs/validation/doc_validator.py --check-code-refs --fail-fast
          echo "✅ Code references validation passed"
        
      - name: Test Documentation Examples
        run: |
          python docs/validation/doc_validator.py --test-examples --fail-fast
          echo "✅ Documentation examples validation passed"
        
      - name: Check Documentation Completeness
        run: |
          python docs/validation/doc_validator.py --check-completeness
          echo "✅ Documentation completeness validation passed"

  reality-check:
    name: System Reality Check
    runs-on: ubuntu-latest
    needs: validate-reality-alignment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil  # For memory monitoring
          
      - name: Run System Reality Check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python docs/validation/reality_checker.py --check-all --fail-on-critical
          echo "✅ Reality check passed"
        
      - name: Generate Reality Report
        if: always()
        run: |
          python docs/validation/reality_checker.py --check-all --save-report docs/metrics/reality-check-ci.json
          
      - name: Upload Reality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-check-report
          path: docs/metrics/reality-check-ci.json

  quality-gates:
    name: Quality Gates Enforcement
    runs-on: ubuntu-latest
    needs: [validate-documentation-structure, validate-reality-alignment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy psutil
          
      - name: Enforce Quality Gates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python docs/validation/quality_gates.py --ci
          if [ $? -ne 0 ]; then
            echo "❌ Quality gates failed - blocking deployment"
            exit 1
          fi
          echo "✅ All quality gates passed"
        
      - name: Generate Quality Gate Report
        if: always()
        run: |
          python docs/validation/quality_gates.py --ci --report > docs/metrics/quality-gates-ci.json
          
      - name: Upload Quality Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-report
          path: docs/metrics/quality-gates-ci.json

  documentation-drift-detection:
    name: Documentation Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for comparison
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Detect Documentation Drift
        run: |
          # Check if documentation changes align with code changes
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          
          # Check if code changes without corresponding doc updates
          if grep -q "^src/" changed_files.txt; then
            echo "Code changes detected, checking for documentation updates..."
            if ! grep -q "^docs/" changed_files.txt; then
              echo "⚠️ WARNING: Code changes without documentation updates"
              echo "Consider updating documentation to reflect code changes"
            else
              echo "✅ Code and documentation changes detected"
            fi
          fi
          
      - name: Validate Single Source of Truth
        run: |
          # Ensure no process documentation exists outside /docs/
          find . -name "*.md" -not -path "./docs/*" -not -path "./.github/*" -not -name "README.md" -not -name "CLAUDE.md" > external_docs.txt
          
          if [ -s external_docs.txt ]; then
            echo "❌ VIOLATION: Process documentation found outside /docs/"
            echo "Files that should be moved to /docs/:"
            cat external_docs.txt
            exit 1
          else
            echo "✅ Single source of truth maintained - all process docs in /docs/"
          fi

  update-documentation-metrics:
    name: Update Documentation Metrics
    runs-on: ubuntu-latest
    needs: [reality-check, quality-gates]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Update Metrics
        run: |
          # Create metrics directory
          mkdir -p docs/metrics
          
          # Generate documentation validation metrics
          python docs/validation/doc_validator.py --generate-report > docs/metrics/documentation-validation.json
          
          # Update last validation timestamp
          echo "{\"last_validated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"$GITHUB_SHA\"}" > docs/metrics/validation-timestamp.json
          
          echo "✅ Documentation metrics updated"
          
      - name: Commit metrics updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -n "$(git status --porcelain docs/metrics/)" ]; then
            git add docs/metrics/
            git commit -m "Update documentation validation metrics [skip ci]"
            git push
          else
            echo "No metrics changes to commit"
          fi